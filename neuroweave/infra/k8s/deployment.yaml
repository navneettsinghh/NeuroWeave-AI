apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroweave-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neuroweave-api
  template:
    metadata:
      labels:
        app: neuroweave-api
    spec:
      containers:
        - name: api
          image: neuroweave-ai:latest
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: neuroweave-api
spec:
  selector:
    app: neuroweave-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
